# Experiment C: full fine-tuning of ModernBERT-base.
# At ~150M params this fits comfortably on a single 24GB L4; it is not expensive.
run_name: full-modernbert-base
seed: 42

model:
  name: answerdotai/ModernBERT-base
  mode: full
  pooling: cls
  dropout: 0.1
  max_length: 2048
  attn_implementation: auto

data:
  train: data/processed/train.jsonl
  val: data/processed/val.jsonl
  max_train_examples: null

train:
  epochs: 3
  batch_size: 16
  grad_accum: 1
  lr: 1.0e-3                 # head
  encoder_lr: 3.0e-5         # encoder
  weight_decay: 0.01
  warmup_ratio: 0.06
  max_grad_norm: 1.0
  bf16: auto
  eval_every_steps: 500
  save_every_steps: 500
  log_every_steps: 20
  num_workers: 2
  pos_weight: 1.0

output:
  dir: runs/full-modernbert-base
  gcs_dir: null
